name: system_design
description: Shared design system — tokens, theme and presentation-only widgets, reusable across apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  auto_size_text: ^3.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  liquid_glass_renderer: ^0.2.0-dev.4
  logger: ^2.5.0
  # The icon font every generation draws. A design system that hardcodes a
  # close cross and a back arrow has to draw them from the same family the
  # host app does, or one screen carries two icon families.
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Pixel access for tool/strip_icon_marker.dart, which wipes Gemini's
  # watermark out of a generated app icon. Nothing in lib/ imports it — it is
  # here because `dart run` resolves a script against ITS OWN package, so the
  # host app's copy of this dependency is invisible to a script living here.
  image: ^4.9.1

flutter:
